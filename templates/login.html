<!DOCTYPE html>
<html>
<head>
    <title>Login - Gym Tracker</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

<div class="login-container">
    <div class="login-visual">
        <div class="visual-content">
            <h1>Gym Tracker AI</h1>
            <p>Track your workouts, analyze your form, and visualize your progress with smart insights.</p>
        </div>
        <div class="overlay"></div>
        <img src="https://images.unsplash.com/photo-1534438327276-14e5300c3a48?q=80&w=1470&auto=format&fit=crop" alt="Gym Background">
    </div>

    <div class="login-form-section">
        <div class="form-wrapper">
            <div class="brand-mobile">Gym Tracker AI</div>
            
            <h2>Welcome Back</h2>
            <p class="subtitle">Please enter your details to sign in.</p>

            <form action="/login_user" method="post">
                <div class="input-group">
                    <label>Username</label>
                    <input type="text" name="username" placeholder="e.g. uday_kiran" required>
                </div>

                <div class="input-group">
                    <label>Password</label>
                    <input type="password" name="password" placeholder="••••••••" required>
                </div>

                <button type="submit" class="btn-primary">Sign In</button>
            </form>

            <div class="footer-text">
                Don't have an account? <a href="/register">Create account</a>
            </div>
        </div>
    </div>
</div>

</body>
</html>
