<!DOCTYPE html>
<html>
<head>
    <title>AI Planner - Gym Tracker</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
        /* Custom styles for the generated plan content */
        .plan-content h3 { color: #6366f1; margin-top: 25px; border-bottom: 2px solid #e2e8f0; padding-bottom: 10px; }
        .plan-content ul { padding-left: 20px; line-height: 1.6; color: #334155; }
        .plan-content table { width: 100%; border-collapse: collapse; margin: 15px 0; }
        .plan-content th { background: #f8fafc; text-align: left; padding: 10px; border: 1px solid #e2e8f0; }
        .plan-content td { padding: 10px; border: 1px solid #e2e8f0; }
        .loader { border: 4px solid #f3f3f3; border-top: 4px solid #6366f1; border-radius: 50%; width: 30px; height: 30px; animation: spin 1s linear infinite; margin: 20px auto; display: none; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
<div class="page-wrapper">
    <div class="card card-wide">
        <div style="display:flex; justify-content:space-between; align-items:center;">
            <h2>Fitness Planner 🧬</h2>
            <a href="{{ url_for('dashboard', username=username) }}" style="font-size:1.5rem; text-decoration:none;">⬅️</a>
        </div>
        <p class="subtitle">Select your goal, and let AI build your roadmap.</p>

        <div style="background: #f1f5f9; padding: 20px; border-radius: 12px; margin-bottom: 20px;">
            <label>What is your primary goal?</label>
            <select id="goalSelect">
                <option value="Weight Loss">🔥 Weight Loss (Burn Fat)</option>
                <option value="Weight Gain">💪 Weight Gain (Build Muscle)</option>
                <option value="Maintenance">⚖️ Maintenance (Stay Fit)</option>
            </select>

            <label>Dietary Preference</label>
            <select id="dietSelect">
                <option value="Balanced">Balanced (Standard)</option>
                <option value="Vegetarian">Vegetarian</option>
                <option value="High Protein">High Protein</option>
                <option value="Vegan">Vegan</option>
            </select>

            <button onclick="generatePlan()" class="btn-primary" style="margin-top: 10px;">Generate My Plan ✨</button>
        </div>

        <div id="loader" class="loader"></div>

        <div id="planResult" class="plan-content" style="display:none;"></div>
    </div>
</div>

<script>
    async function generatePlan() {
        const goal = document.getElementById('goalSelect').value;
        const diet = document.getElementById('dietSelect').value;
        const loader = document.getElementById('loader');
        const resultDiv = document.getElementById('planResult');

        // UI Updates
        loader.style.display = 'block';
        resultDiv.style.display = 'none';
        resultDiv.innerHTML = '';

        try {
            const response = await fetch('/generate_plan', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ 
                    username: "{{ username }}", 
                    goal: goal,
                    diet_pref: diet
                })
            });

            const data = await response.json();
            
            if (data.error) {
                resultDiv.innerHTML = `<p style="color:red;">Error: ${data.error}</p>`;
            } else {
                resultDiv.innerHTML = data.plan; // Insert HTML directly
            }
        } catch (err) {
            resultDiv.innerHTML = `<p style="color:red;">Failed to connect to AI.</p>`;
        } finally {
            loader.style.display = 'none';
            resultDiv.style.display = 'block';
        }
    }
</script>
</body>
</html>
